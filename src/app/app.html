<div class="cursor-ring" #ring [class.ready]="ready()" [class.hover]="hovering()">
  <span></span>
</div>
<div class="cursor-dot" #dot [class.ready]="ready()"><span></span></div>

@if (!hidePreloader()) {
  <div class="preloader" [class.out]="loaded()">
    <span class="pre-text">Ahmed Abd-Elnasser</span>
    <span class="pre-line"></span>
  </div>
}

<app-navbar [show]="loaded()" />

<main>
  <section class="hero" [class.go]="loaded()" id="top">
    <div class="hero-slides">
      @for (s of heroSlides; track s.src; let i = $index) {
        <div
          class="slide"
          [class.active]="i === current()"
          [class.prev]="i === prev()"
          [style.background-image]="'url(' + s.src + ')'"
          [style.background-position]="s.pos"
        ></div>
      }
    </div>
    <div class="hero-shade"></div>

    <div class="hero-content">
      <!-- <p class="eyebrow">Portfolio — 2026</p> -->
      <h1 class="hero-name">
        <span class="line"><span class="word">Ahmed</span></span>
        <span class="line"
          ><span class="word"><em>Abd-Elnasser</em></span></span
        >
      </h1>
      <p class="hero-sub">Visualization | Design | Interior Design</p>
    </div>

    <div class="hero-bars">
      @for (s of heroSlides; track s.src; let i = $index) {
        <button
          class="bar"
          [class.active]="i === current()"
          (click)="show(i)"
          [attr.aria-label]="'Slide ' + (i + 1)"
        >
          <span></span>
        </button>
      }
    </div>

    <div class="hero-bottom">
      <span class="counter">{{ counter() }} <i>/</i> {{ total }}</span>
      <a class="scroll" href="#about">Scroll <span></span></a>
    </div>
  </section>

  <app-about />
  <app-work />
  <app-contact />
</main>
